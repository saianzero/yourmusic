[project]
name = "raga-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pyyaml",
    "numpy",
    "torch",
    "torchaudio",
    "demucs",
    "torchcrepe",
    "librosa",
    "soundfile",
    "mido",
    "pretty_midi",
    "sqlmodel",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
